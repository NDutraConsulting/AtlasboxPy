# This is a workspace root, not an installable package — there's no
# [project]/[build-system] here. It exists only to give `pytest examples/`,
# run from the repo root, the same asyncio_mode setting each package's own
# pyproject.toml carries for its own tests. The actual packages live under
# packages/ — see packages/atlasboxpy_controller/ and
# packages/atlasboxpy_repository/, each with its own pyproject.toml.

[tool.pytest.ini_options]
testpaths = ["examples"]
asyncio_mode = "auto"
