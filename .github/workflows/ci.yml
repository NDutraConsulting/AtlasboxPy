name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src/
      - name: Test
        run: pytest --cov=validator_gateway --cov-report=term-missing
      - name: Core stays transport-agnostic (no fastapi import in core modules)
        run: |
          CORE_PATHS="src/validator_gateway/exceptions.py src/validator_gateway/controller.py \
            src/validator_gateway/gateway.py src/validator_gateway/responses.py \
            src/validator_gateway/config.py src/validator_gateway/logging.py \
            src/validator_gateway/registry.py src/validator_gateway/recovery"
          if grep -rlE '^\s*(import|from)\s+fastapi(\s|\.|$)' $CORE_PATHS; then
            echo "::error::Core modules must not import fastapi — keep it framework-agnostic (Design Decision 4)." >&2
            exit 1
          fi
      - name: Core test suite runs without fastapi installed
        run: |
          python -m venv /tmp/core-only-venv
          /tmp/core-only-venv/bin/pip install -e . pytest pytest-asyncio pytest-cov
          # --ignore, not -k: -k only filters selected tests, it doesn't skip
          # collection, so a plain `pytest -k "not fastapi_integration"` still
          # imports test_fastapi_integration.py and fails with a fastapi
          # ModuleNotFoundError before any filtering happens.
          /tmp/core-only-venv/bin/pytest tests/ \
            --ignore=tests/test_fastapi_integration.py \
            --ignore=tests/test_openapi_registry.py
