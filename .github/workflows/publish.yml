name: Publish

# Runs only when a GitHub Release is published — never on a plain push or
# tag. Left unexecuted until the maintainer explicitly cuts a release; do
# not trigger this manually. Builds and publishes atlasboxpy_controller
# only — atlasboxpy_repository (packages/atlasboxpy_repository/) is a
# separate package with its own release cadence and would need its own
# workflow when it's ready to publish.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/atlasboxpy_controller
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: pip install build
      - name: Build sdist and wheel
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/atlasboxpy_controller/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing (OIDC) — no stored PyPI token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
