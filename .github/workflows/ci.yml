name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-atlasboxpy-controller:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: packages/atlasboxpy_controller
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src/
      - name: Test
        run: pytest --cov=atlasboxpy_controller --cov-report=term-missing
      - name: Core stays transport-agnostic (no fastapi import in core modules)
        run: |
          CORE_PATHS="src/atlasboxpy_controller/exceptions.py \
            src/atlasboxpy_controller/controller.py \
            src/atlasboxpy_controller/responses.py \
            src/atlasboxpy_controller/registry.py"
          if grep -rlE '^\s*(import|from)\s+fastapi(\s|\.|$)' $CORE_PATHS; then
            echo "::error::Core modules must not import fastapi — keep it framework-agnostic (Design Decision 4)." >&2
            exit 1
          fi
      - name: Core test suite runs without fastapi installed
        run: |
          python -m venv /tmp/core-only-venv
          /tmp/core-only-venv/bin/pip install -e . pytest pytest-asyncio pytest-cov
          # --ignore, not -k: -k only filters selected tests, it doesn't skip
          # collection, so a plain `pytest -k "not fastapi_integration"` still
          # imports test_fastapi_integration.py and fails with a fastapi
          # ModuleNotFoundError before any filtering happens.
          /tmp/core-only-venv/bin/pytest tests/ \
            --ignore=tests/test_fastapi_integration.py \
            --ignore=tests/test_openapi_registry.py \
            --ignore=tests/test_integration.py

  test-atlasboxpy-repository:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: packages/atlasboxpy_repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src/
      - name: Test
        run: pytest

  test-examples:
    # Demo apps under examples/ exercise both packages together — this is
    # workspace-level integration content, not part of either package's
    # own distribution, so it gets its own job rather than living inside
    # either package-specific one above.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install atlasboxpy_controller
        run: pip install -e "packages/atlasboxpy_controller[dev]"
      - name: Install atlasboxpy_repository
        run: pip install -e "packages/atlasboxpy_repository[dev]"
      - name: Example demo projects (P12)
        run: pytest examples/ -v
