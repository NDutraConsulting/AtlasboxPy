[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atlasboxpy_controller"
version = "0.1.0"
description = "Formatted, consistent error handling for your business logic — for REST routes, background workers, agents, and gRPC servicers alike."
readme = "README.md"
authors = [
    {name = "Nikko Dutra", email = "ndutra.consulting@gmail.com"},
    {name = "NDutra Consulting"},
]
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.100"]
dev = [
    "pytest", "pytest-asyncio", "pytest-cov", "httpx", "ruff", "mypy", "fastapi", "uvicorn",
    "sqlalchemy>=2.0", "aiosqlite", "greenlet",
]

[project.scripts]
atlasboxpy-controller = "atlasboxpy_controller.cli:main"

[project.urls]
Homepage = "https://github.com/TODO/atlasboxpy_controller"
Repository = "https://github.com/TODO/atlasboxpy_controller"
Issues = "https://github.com/TODO/atlasboxpy_controller/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/atlasboxpy_controller"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = "tests.*"
strict = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
